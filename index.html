<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>100 Câu Đố Siêu Mẹo - Hack Não 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-subtle: #eff6ff;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --wrong: #ef4444;
      --wrong-bg: #fef2f2;
      --warning: #f59e0b;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-body: #0b0f17;
      --bg-card: #151c28;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #243044;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-subtle: rgba(59, 130, 246, 0.12);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --wrong: #f43f5e;
      --wrong-bg: rgba(244, 63, 94, 0.15);
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding: 12px 16px 40px;
    }

    /* --- Header --- */
    .app-header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 1.5rem;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: var(--card-shadow);
      transition: var(--transition);
      color: var(--text-main);
    }

    .icon-btn:hover {
      transform: scale(1.05);
      border-color: var(--primary);
    }

    /* --- Main Container --- */
    .quiz-app {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top stats */
    .status-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .badge-pill {
      background: var(--primary-subtle);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background-color: var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 1%;
      background: linear-gradient(90deg, var(--primary), #8b5cf6);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    /* Card Question */
    .quiz-card {
      background-color: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }

    .media-container {
      width: 100%;
      height: 220px;
      position: relative;
      background-color: var(--border);
      overflow: hidden;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .media-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-title {
      font-size: 1.15rem;
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
    }

    .options-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .opt-btn {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: var(--transition);
      line-height: 1.35;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: var(--primary-subtle);
      transform: translateY(-1px);
    }

    .opt-btn:disabled {
      cursor: default;
    }

    .opt-btn.correct {
      border-color: var(--success) !important;
      background-color: var(--success-bg) !important;
      color: var(--success) !important;
    }

    .opt-btn.wrong {
      border-color: var(--wrong) !important;
      background-color: var(--wrong-bg) !important;
      color: var(--wrong) !important;
    }

    /* Explanation Box */
    .trap-explanation {
      display: none;
      background-color: var(--primary-subtle);
      border-left: 4px solid var(--warning);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 14px 16px;
      animation: fadeIn 0.3s ease;
    }

    .trap-header {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--warning);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .trap-desc {
      font-size: 0.92rem;
      line-height: 1.5;
      color: var(--text-main);
    }

    /* Navigation Footer */
    .card-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
    }

    .btn {
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-body);
      color: var(--text-main);
    }

    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    /* Modal Grid Chọn Câu */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .num-btn {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .num-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .num-btn.current {
      outline: 2px solid var(--primary);
    }

    .num-btn.is-correct {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .num-btn.is-wrong {
      background: var(--wrong);
      color: #fff;
      border-color: var(--wrong);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .media-container { height: 180px; }
      .card-content { padding: 16px; gap: 14px; }
      .question-title { font-size: 1.05rem; }
      .opt-btn { padding: 12px 14px; font-size: 0.9rem; }
      .modal-body { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <h1 class="brand-title">Siêu Mẹo 100</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-grid" title="Danh sách 100 câu">☰</button>
      <button class="icon-btn" id="btn-theme" title="Đổi màu nền">🌙</button>
    </div>
  </header>

  <main class="quiz-app">
    <div class="status-card">
      <span id="label-progress">Câu 1/100</span>
      <span class="badge-pill" id="label-score">Điểm: 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progress-fill"></div>
    </div>

    <article class="quiz-card">
      <div class="media-container">
        <span class="media-badge" id="category-badge">BẪY LOGIC</span>
        <img id="quiz-img" src="" alt="Hình minh họa" onerror="this.src='https://images.unsplash.com/photo-1518770660439-4636190af475?w=700&auto=format&fit=crop&q=80'">
      </div>

      <div class="card-content">
        <h2 class="question-title" id="quiz-question">Đang tải nội dung...</h2>

        <div class="options-list" id="quiz-options"></div>

        <div class="trap-explanation" id="quiz-explanation">
          <div class="trap-header">⚠️ Bẫy ở chỗ này!</div>
          <p class="trap-desc" id="quiz-trap-text"></p>
        </div>
      </div>

      <footer class="card-footer">
        <button class="btn btn-secondary" id="btn-prev" disabled>← Câu trước</button>
        <button class="btn btn-primary" id="btn-next">Tiếp theo →</button>
      </footer>
    </article>
  </main>

  <!-- Modal Bảng Số Câu Hỏi -->
  <div class="modal-backdrop" id="modal-grid">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Danh sách 100 câu</h3>
        <button class="icon-btn" id="btn-close-modal" style="width:32px;height:32px;font-size:0.9rem;">✕</button>
      </div>
      <div class="modal-body" id="grid-container"></div>
    </div>
  </div>

  <script>
    /* ==========================================================
       DỮ LIỆU ĐẦY ĐỦ 100 CÂU ĐỐ MẸO BẪY TƯ DUY KINH ĐIỂN
       ========================================================== */
    const riddles = [
      {
        id: 1,
        cat: "BẪY TOÁN HỌC",
        q: "Một con ốc sên rơi xuống giếng sâu 10m. Ban ngày bò lên 3m, ban đêm tụt xuống 2m. Sau bao nhiêu ngày ốc sên lên tới miệng giếng?",
        img: "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=700&auto=format&fit=crop&q=80",
        opt: ["10 ngày", "8 ngày", "7 ngày", "9 ngày"],
        cor: 1,
        trap: "Mỗi ngày tiến 1m, sau 7 ngày được 7m. Sang ban ngày thứ 8 bò thêm 3m là chạm miệng giếng và thoát ra luôn, không bị tụt xuống nữa."
      },
      {
        id: 2,
        cat: "BẪY VẬT LÝ",
        q: "Tàu điện chạy về hướng Nam với tốc độ 60 km/h. Gió thổi về hướng Tây 30 km/h. Hỏi khói tàu bay về hướng nào?",
        img: "https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=700&auto=format&fit=crop&q=80",
        opt: ["Hướng Tây", "Hướng Tây Nam", "Không có khói", "Hướng Bắc"],
        cor: 2,
        trap: "Tàu điện chạy bằng điện nên hoàn toàn không nhả khói."
      },
      {
        id: 3,
        cat: "BẪY GIA ĐÌNH",
        q: "Hai người cha và hai người con cùng đi câu cá. Mỗi người câu được đúng 1 con cá. Khi về chỉ có 3 con cá. Vì sao?",
        img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=700&auto=format&fit=crop&q=80",
        opt: ["Rơi mất 1 con", "Có 3 người: Ông nội, Bố và Con", "Người cha không tính", "Một con cá to gấp đôi"],
        cor: 1,
        trap: "Chỉ có 3 người: Ông nội, Cha và Con trai. Người cha vừa là con của ông nội vừa là cha của đứa con nhỏ."
      },
      {
        id: 4,
        cat: "BẪY THỜI GIAN",
        q: "Bác sĩ đưa cho bạn 3 viên thuốc và dặn cứ 30 phút uống 1 viên. Bạn sẽ uống hết số thuốc đó trong bao nhiêu phút?",
        img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=700&auto=format&fit=crop&q=80",
        opt: ["90 phút", "60 phút", "45 phút", "30 phút"],
        cor: 1,
        trap: "Viên thứ nhất uống ngay lập tức lúc 0 phút, viên thứ hai sau 30 phút, viên thứ ba sau 60 phút."
      },
      {
        id: 5,
        cat: "BẪY KHÔNG GIAN",
        q: "Làm sao ném quả bóng tennis thật mạnh, nó tự dừng lại rồi bay ngược lại đúng tay bạn mà không chạm bất cứ vật cản nào?",
        img: "https://images.unsplash.com/photo-1595435934249-5df7ed86e1c0?w=700&auto=format&fit=crop&q=80",
        opt: ["Dùng dây thun", "Ném thẳng lên trời", "Tạo xoáy cực mạnh", "Ném trong phòng kín"],
        cor: 1,
        trap: "Ném thẳng đứng lên trời, trọng lực sẽ kéo quả bóng dừng lại và tự rơi ngược về tay bạn."
      },
      {
        id: 6,
        cat: "ĐỐ CHỮ",
        q: "Từ nào trong từ điển tiếng Việt mà bất kỳ người Việt Nam nào phát âm cũng đều 'sai'?",
        img: "https://images.unsplash.com/photo-1457369804613-52c61a468e7d?w=700&auto=format&fit=crop&q=80",
        opt: ["Từ 'Khuỷu'", "Từ 'Ngoằn ngoèo'", "Từ 'Sai'", "Từ 'Nghiêng'"],
        cor: 2,
        trap: "Chính là từ 'Sai'. Dù phát âm chuẩn đến đâu thì từ đó vẫn là từ 'Sai'."
      },
      {
        id: 7,
        cat: "BẪY TƯ TƯỞNG",
        q: "Một người thợ nhảy xuống từ chiếc thang cao 10 mét nhưng không hề bị xây xát hay đau đớn. Tại sao?",
        img: "https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=700&auto=format&fit=crop&q=80",
        opt: ["Có đệm lò xo", "Đang đứng ở bậc dưới cùng", "Thang ngã nghiêng", "Có dù bay"],
        cor: 1,
        trap: "Thang dài 10m nhưng anh ấy đang đứng ở bậc thang sát đất."
      },
      {
        id: 8,
        cat: "NGUYÊN LÝ LOGIC",
        q: "Trong tủ tối có 10 chiếc tất đen và 10 chiếc tất trắng lẫn lộn. Cần lấy ra ít nhất bao nhiêu chiếc để chắc chắn có 1 đôi cùng màu?",
        img: "https://images.unsplash.com/photo-1586350977771-b3b0abd50c82?w=700&auto=format&fit=crop&q=80",
        opt: ["11 chiếc", "2 chiếc", "3 chiếc", "10 chiếc"],
        cor: 2,
        trap: "Chỉ có 2 loại màu. Lấy 3 chiếc thì theo nguyên lý Dirichlet chắc chắn có ít nhất 2 chiếc cùng màu."
      },
      {
        id: 9,
        cat: "BẪY TOÁN HỌC",
        q: "Một gia đình có 6 người con trai. Mỗi người con trai đều có đúng 1 người em gái. Hỏi gia đình có bao nhiêu người?",
        img: "https://images.unsplash.com/photo-1511895426328-dc8714191300?w=700&auto=format&fit=crop&q=80",
        opt: ["14 người", "9 người", "12 người", "8 người"],
        cor: 1,
        trap: "Gồm Bố, Mẹ, 6 người con trai và 1 cô con gái út (em gái chung của cả 6 người anh) = 2 + 6 + 1 = 9 người."
      },
      {
        id: 10,
        cat: "LỊCH THỜI GIAN",
        q: "Tháng nào trong năm có 28 ngày?",
        img: "https://images.unsplash.com/photo-1506784365847-bbad939e9335?w=700&auto=format&fit=crop&q=80",
        opt: ["Chỉ tháng 2", "Tháng nhuận", "Tất cả các tháng", "Tháng 2 năm thường"],
        cor: 2,
        trap: "Tất cả 12 tháng trong năm đều trải qua ngày thứ 28."
      },
      {
        id: 11,
        cat: "ĐỐ CƠ THỂ",
        q: "Cái gì của bạn nhưng người khác lại dùng nó nhiều hơn bạn?",
        img: "https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=700&auto=format&fit=crop&q=80",
        opt: ["Tiền bạc", "Tên của bạn", "Điện thoại", "Quần áo"],
        cor: 1,
        trap: "Tên của bạn chủ yếu để người khác gọi."
      },
      {
        id: 12,
        cat: "VẬT DỤNG ĐỜI SỐNG",
        q: "Cái gì người mua biết, người bán biết, nhưng người dùng không bao giờ biết?",
        img: "https://images.unsplash.com/photo-1544717305-2782549b5136?w=700&auto=format&fit=crop&q=80",
        opt: ["Thuốc mê", "Quan tài", "Bánh sinh nhật", "Món quà bí mật"],
        cor: 1,
        trap: "Quan tài - người nằm trong đó đã mất nên không thể biết."
      },
      {
        id: 13,
        cat: "NGHỊCH LÝ",
        q: "Cái gì càng kéo thì lại càng ngắn lại?",
        img: "https://images.unsplash.com/photo-1527661591475-527312dd65f5?w=700&auto=format&fit=crop&q=80",

      },
      {

        cor: 3,
        trap: "Nó chỉ đơn giản là bị ướt và chìm xuống đáy biển, màu sắc không thay đổi."
      },
      {
        id: 100,
        cat: "CÂU ĐỐ CUỐI CÙNG",
        q: "Bạn vừa hoàn thành 99 câu đố mẹo. Hỏi não của bạn đang ở trạng thái nào?",
        img: "https://images.unsplash.com/photo-1507413245164-6160d8298b31?w=700&auto=format&fit=crop&q=80",
        opt: ["Bị lừa quá nhiều", "Thông minh đột xuất", "Cảnh giác cao độ", "Cả 3 đáp án trên"],
        cor: 3,
        trap: "Chúc mừng bạn đã chinh phục trọn vẹn 100 câu đố bẫy tư duy!"
      }
    ];

    /* ==========================================================
       LOGIC VẬN HÀNH ỨNG DỤNG
       ========================================================== */
    let currentIndex = 0;
    let score = 0;
    const userAnswers = JSON.parse(localStorage.getItem('quiz_answers') || '{}');

    // DOM Elements
    const quizQuestionEl = document.getElementById('quiz-question');
    const quizImgEl = document.getElementById('quiz-img');
    const quizOptionsEl = document.getElementById('quiz-options');
    const quizExplanationEl = document.getElementById('quiz-explanation');
    const quizTrapTextEl = document.getElementById('quiz-trap-text');
    const labelProgressEl = document.getElementById('label-progress');
    const labelScoreEl = document.getElementById('label-score');
    const progressFillEl = document.getElementById('progress-fill');
    const categoryBadgeEl = document.getElementById('category-badge');
    const btnPrevEl = document.getElementById('btn-prev');
    const btnNextEl = document.getElementById('btn-next');
    const btnThemeEl = document.getElementById('btn-theme');
    const btnGridEl = document.getElementById('btn-grid');
    const modalGridEl = document.getElementById('modal-grid');
    const btnCloseModalEl = document.getElementById('btn-close-modal');
    const gridContainerEl = document.getElementById('grid-container');

    // Tính toán lại tổng điểm từ localStorage
    function recalculateScore() {
      score = 0;
      Object.keys(userAnswers).forEach(idx => {
        const q = riddles[idx];
        if (q && userAnswers[idx] === q.cor) {
          score += 10;
        }
      });
      labelScoreEl.textContent = `Điểm: ${score}`;
    }

    // Hiển thị câu hỏi hiện tại
    function renderQuestion(index) {
      const item = riddles[index];
      if (!item) return;

      labelProgressEl.textContent = `Câu ${index + 1}/${riddles.length}`;
      progressFillEl.style.width = `${((index + 1) / riddles.length) * 100}%`;
      categoryBadgeEl.textContent = item.cat || "BẪY TƯ DUY";

      quizQuestionEl.textContent = `Câu ${index + 1}: ${item.q}`;
      quizImgEl.src = item.img;

      // Nạp các lựa chọn
      quizOptionsEl.innerHTML = '';
      const hasAnswered = userAnswers.hasOwnProperty(index);

      item.opt.forEach((optionText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span><b>${String.fromCharCode(65 + optIdx)}.</b> ${optionText}</span>`;

        if (hasAnswered) {
          btn.disabled = true;
          const chosen = userAnswers[index];
          if (optIdx === item.cor) {
            btn.classList.add('correct');
            btn.innerHTML += ` <span>✓</span>`;
          } else if (optIdx === chosen) {
            btn.classList.add('wrong');
            btn.innerHTML += ` <span>✗</span>`;
          }
        } else {
          btn.addEventListener('click', () => handleSelectOption(optIdx));
        }

        quizOptionsEl.appendChild(btn);
      });

      // Hiển thị giải thích nếu đã trả lời
      if (hasAnswered) {
        quizTrapTextEl.textContent = item.trap;
        quizExplanationEl.style.display = 'block';
      } else {
        quizExplanationEl.style.display = 'none';
      }

      // Nút điều hướng
      btnPrevEl.disabled = index === 0;
      btnNextEl.textContent = index === riddles.length - 1 ? 'Xem kết quả' : 'Tiếp theo →';

      recalculateScore();
      renderGridMenu();
    }

    // Xử lý chọn đáp án
    function handleSelectOption(optIdx) {
      if (userAnswers.hasOwnProperty(currentIndex)) return;

      userAnswers[currentIndex] = optIdx;
      localStorage.setItem('quiz_answers', JSON.stringify(userAnswers));
      renderQuestion(currentIndex);
    }

    // Nút Next & Prev
    btnPrevEl.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion(currentIndex);
      }
    });

    btnNextEl.addEventListener('click', () => {
      if (currentIndex < riddles.length - 1) {
        currentIndex++;
        renderQuestion(currentIndex);
      } else {
        alert(`Bạn đã duyệt qua 100 câu đố! Điểm số chung cuộc: ${score}/1000 điểm.`);
      }
    });

    // Dark Mode
    function initTheme() {
      const saved = localStorage.getItem('theme_mode');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        btnThemeEl.textContent = '☀️';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        btnThemeEl.textContent = '🌙';
      }
    }

    btnThemeEl.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme_mode', newTheme);
      btnThemeEl.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });

    // Popup Grid 100 câu
    function renderGridMenu() {
      gridContainerEl.innerHTML = '';
      riddles.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.textContent = idx + 1;

        if (idx === currentIndex) btn.classList.add('current');
        if (userAnswers.hasOwnProperty(idx)) {
          if (userAnswers[idx] === q.cor) {
            btn.classList.add('is-correct');
          } else {
            btn.classList.add('is-wrong');
          }
        }

        btn.addEventListener('click', () => {
          currentIndex = idx;
          renderQuestion(currentIndex);
          modalGridEl.classList.remove('active');
        });

        gridContainerEl.appendChild(btn);
      });
    }

    btnGridEl.addEventListener('click', () => {
      renderGridMenu();
      modalGridEl.classList.add('active');
    });

    btnCloseModalEl.addEventListener('click', () => {
      modalGridEl.classList.remove('active');
    });

    modalGridEl.addEventListener('click', (e) => {
      if (e.target === modalGridEl) modalGridEl.classList.remove('active');
    });

    // Khởi chạy ban đầu
    initTheme();
    renderQuestion(currentIndex);
  </script>
