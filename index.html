<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>100 Câu Đố Siêu Mẹo - Hack Não Cao Cấp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-subtle: #eff6ff;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --wrong: #ef4444;
      --wrong-bg: #fef2f2;
      --warning: #f59e0b;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-body: #0b0f17;
      --bg-card: #151c28;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #243044;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-subtle: rgba(59, 130, 246, 0.12);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --wrong: #f43f5e;
      --wrong-bg: rgba(244, 63, 94, 0.15);
      --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding: 12px 16px 40px;
    }

    .app-header {
      width: 100%;
      max-width: 620px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 1.5rem;
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: var(--card-shadow);
      transition: var(--transition);
      color: var(--text-main);
    }

    .icon-btn:hover {
      transform: scale(1.05);
      border-color: var(--primary);
    }

    .quiz-app {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .status-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .badge-pill {
      background: var(--primary-subtle);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .progress-track {
      width: 100%;
      height: 7px;
      background-color: var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 1%;
      background: linear-gradient(90deg, var(--primary), #8b5cf6);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .quiz-card {
      background-color: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }

    .media-container {
      width: 100%;
      height: 220px;
      position: relative;
      background-color: var(--border);
      overflow: hidden;
    }

    .media-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .media-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-title {
      font-size: 1.15rem;
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-main);
    }

    .options-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .opt-btn {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: var(--transition);
      line-height: 1.35;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: var(--primary-subtle);
      transform: translateY(-1px);
    }

    .opt-btn:disabled {
      cursor: default;
    }

    .opt-btn.correct {
      border-color: var(--success) !important;
      background-color: var(--success-bg) !important;
      color: var(--success) !important;
    }

    .opt-btn.wrong {
      border-color: var(--wrong) !important;
      background-color: var(--wrong-bg) !important;
      color: var(--wrong) !important;
    }

    .trap-explanation {
      display: none;
      background-color: var(--primary-subtle);
      border-left: 4px solid var(--warning);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 14px 16px;
      animation: fadeIn 0.3s ease;
    }

    .trap-header {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--warning);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .trap-desc {
      font-size: 0.92rem;
      line-height: 1.5;
      color: var(--text-main);
    }

    .card-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
    }

    .btn {
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--bg-body);
      color: var(--text-main);
    }

    .btn-secondary:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .num-btn {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .num-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .num-btn.current {
      outline: 2px solid var(--primary);
    }

    .num-btn.is-correct {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .num-btn.is-wrong {
      background: var(--wrong);
      color: #fff;
      border-color: var(--wrong);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .media-container { height: 180px; }
      .card-content { padding: 16px; gap: 14px; }
      .question-title { font-size: 1.05rem; }
      .opt-btn { padding: 12px 14px; font-size: 0.9rem; }
      .modal-body { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">🧠</span>
      <h1 class="brand-title">100 Siêu Đố Mẹo</h1>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-grid" title="Danh mục 100 câu">☰</button>
      <button class="icon-btn" id="btn-theme" title="Đổi màu nền">🌙</button>
    </div>
  </header>

  <main class="quiz-app">
    <div class="status-card">
      <span id="label-progress">Câu 1/100</span>
      <span class="badge-pill" id="label-score">Điểm: 0</span>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progress-fill"></div>
    </div>

    <article class="quiz-card">
      <div class="media-container">
        <span class="media-badge" id="category-badge">BẪY LOGIC</span>
        <img id="quiz-img" src="" alt="Hình minh họa" onerror="this.src='https://images.unsplash.com/photo-1518770660439-4636190af475?w=700&auto=format&fit=crop&q=80'">
      </div>

      <div class="card-content">
        <h2 class="question-title" id="quiz-question">Đang nạp câu hỏi...</h2>

        <div class="options-list" id="quiz-options"></div>

        <div class="trap-explanation" id="quiz-explanation">
          <div class="trap-header">⚡ Phân tích bẫy tư duy</div>
          <p class="trap-desc" id="quiz-trap-text"></p>
        </div>
      </div>

      <footer class="card-footer">
        <button class="btn btn-secondary" id="btn-prev" disabled>← Câu trước</button>
        <button class="btn btn-primary" id="btn-next">Tiếp theo →</button>
      </footer>
    </article>
  </main>

  <div class="modal-backdrop" id="modal-grid">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">100 Câu Đố Hack Não</h3>
        <button class="icon-btn" id="btn-close-modal" style="width:32px;height:32px;font-size:0.9rem;">✕</button>
      </div>
      <div class="modal-body" id="grid-container"></div>
    </div>
  </div>

  <script>
    /* ==========================================================
       KHO DỮ LIỆU: 100 CÂU ĐỐ SIÊU MẸO, BẪY TƯ DUY & NGHỊCH LÝ
       ========================================================== */
    const riddles = [
      {
        id: 1,
        cat: "NGHỊCH LÝ TỬ TÙ",
        q: "Tù nhân bị vua phán: 'Nói 1 câu duy nhất. Nếu nói ĐÚNG sẽ bị chém đầu, nếu nói SAI sẽ bị treo cổ'. Người này nói câu gì để buộc vua phải tha mạng?",
        img: "https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=700&auto=format&fit=crop&q=80",
        opt: ["'Tôi vô tội hoàn toàn'", "'Tôi sẽ bị chém đầu'", "'Tôi sẽ bị treo cổ'", "'Bệ hạ là minh quân'"],
        cor: 2,
        trap: "Nếu vua treo cổ thì câu nói thành ĐÚNG (mà đúng thì phải chém đầu). Nếu chém đầu thì câu nói thành SAI (mà sai thì phải treo cổ). Nghịch lý logic khiến cả 2 án phạt đều tự hủy."
      },
      {
        id: 2,
        cat: "ĐỐ MẸO THỜI GIAN",
        q: "Lúc 3 giờ 15 phút, góc hợp giữa kim giờ và kim phút trên mặt đồng hồ kim truyền thống bằng bao nhiêu độ?",
        img: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=700&auto=format&fit=crop&q=80",
        opt: ["0 độ (chập vào nhau)", "7.5 độ", "5 độ", "12.5 độ"],
        cor: 1,
        trap: "Bẫy trực giác tưởng 2 kim đè lên nhau. Nhưng sau 15 phút (1/4 giờ), kim giờ đã nhích đi 1/4 quãng đường giữa số 3 và số 4: 30° / 4 = 7.5°."
      },
      {
        id: 3,
        cat: "BẪY XÁC SUẤT TOÁN",
        q: "Từ 1 đến 100 có tổng cộng bao nhiêu lần chữ số 9 xuất hiện?",
        img: "https://images.unsplash.com/photo-1509228468518-180dd4864904?w=700&auto=format&fit=crop&q=80",
        opt: ["10 lần", "11 lần", "19 lần", "20 lần"],
        cor: 3,
        trap: "Mọi người hay quên đếm hàng chục của dãy 90: (9, 19, 29, 39, 49, 59, 69, 79, 89, 99 có 11 chữ số 9) cộng thêm (90, 91, 92, 93, 94, 95, 96, 97, 98 có 9 chữ số 9) = 20 lần."
      },
      {
        id: 4,
        cat: "VỤ ÁN MẸO",
        q: "Hai người cùng uống một loại trà đá pha sẵn từ cùng một bình. A uống cạn 5 ly trong 2 phút và sống sót. B nhâm nhi 1 ly trong 30 phút thì chết vì độc. Vì sao?",
        img: "https://images.unsplash.com/photo-1517256064527-09c73fc73e38?w=700&auto=format&fit=crop&q=80",
        opt: ["A có kháng thể", "Chất độc nằm trong đá viên", "B bị dị ứng trà", "Ly của B bị bôi thuốc"],
        cor: 1,
        trap: "Chất độc được đóng băng bên trong các viên đá. A uống nhanh khi đá chưa tan nên thoát chết, B uống chậm để đá tan hết nên trúng độc."
      },
      {
        id: 5,
        cat: "TOÁN HỌC SINH TỒN",
        q: "Có 8 đồng xu vàng giống hệt nhau, trong đó có 1 đồng xu giả nhẹ hơn. Dùng cân đĩa thăng bằng, cần ít nhất bao nhiêu lần cân để chắc chắn tìm ra?",
        img: "https://images.unsplash.com/photo-1610375461246-83df859d849d?w=700&auto=format&fit=crop&q=80",
        opt: ["1 lần", "2 lần", "3 lần", "4 lần"],
        cor: 1,
        trap: "Chia 8 đồng thành 3 nhóm: 3 - 3 - 2. Cân lần 1: hai nhóm 3 đồng. Nếu bằng nhau, xu giả ở nhóm 2; nếu lệch, lấy nhóm nhẹ hơn. Cân lần 2 giữa 2 đồng bất kỳ là xác định ngay."
      },
      {
        id: 6,
        cat: "BẪY TÂM LÝ TUỔI",
        q: "Năm tôi 6 tuổi, em gái tôi bằng nửa tuổi tôi. Nay tôi 70 tuổi, hỏi em gái tôi bao nhiêu tuổi?",
        img: "https://images.unsplash.com/photo-1511895426328-dc8714191300?w=700&auto=format&fit=crop&q=80",
        opt: ["35 tuổi", "67 tuổi", "64 tuổi", "68 tuổi"],
        cor: 1,
        trap: "Não bộ dễ bị phản xạ chia đôi 70 / 2 = 35. Nhưng lúc đầu anh hơn em 3 tuổi (6 - 3 = 3), thì khi anh 70 tuổi em gái phải là 70 - 3 = 67 tuổi."
      },
      {
        id: 7,
        cat: "NGHI ÁN PHÒNG KÍN",
        q: "Căn phòng trống khóa kín từ bên trong, người đàn ông treo cổ lơ lửng cách sàn 1m. Bên dưới chân chỉ có một vũng nước lớn. Anh ta đã làm cách nào?",
        img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=700&auto=format&fit=crop&q=80",
        opt: ["Dùng bệ phóng lò xo", "Đứng lên tảng nước đá lớn", "Nhờ tòng phạm dọn ghế", "Đu dây từ trần nhà"],
        cor: 1,
        trap: "Anh ta đứng lên một tảng băng đá lớn để tròng cổ vào dây. Theo thời gian, tảng băng tan hoàn toàn thành vũng nước."
      },
      {
        id: 8,
        cat: "TỶ LỆ BÙNG NỔ",
        q: "Trong hồ, bèo nhân đôi diện tích mỗi ngày. Sau 48 ngày bèo phủ kín mặt hồ. Hỏi sau bao nhiêu ngày bèo phủ được 1/2 mặt hồ?",
        img: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=700&auto=format&fit=crop&q=80",
        opt: ["24 ngày", "47 ngày", "12 ngày", "36 ngày"],
        cor: 1,
        trap: "Bẫy lấy 48 chia đôi ra 24. Nhưng vì mỗi ngày tăng gấp đôi, nên chỉ cần 1 ngày trước khi đầy (ngày thứ 47) là bèo đã chiếm đúng nửa hồ."
      },
      {
        id: 9,
        cat: "ĐỐ MẸO THẦN TỐC",
        q: "Nếu 3 con mèo bắt được 3 con chuột trong 3 phút, thì cần bao nhiêu con mèo để bắt được 100 con chuột trong 100 phút?",
        img: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=700&auto=format&fit=crop&q=80",
        opt: ["100 con mèo", "3 con mèo", "30 con mèo", "1 con mèo"],
        cor: 1,
        trap: "3 con mèo bắt 3 con chuột trong 3 phút, nghĩa là trung bình 3 con mèo này cứ mỗi 1 phút bắt được 1 con chuột. Vậy trong 100 phút chúng bắt được 100 con."
      },
      {
        id: 10,
        cat: "QUAN HỆ HUYẾT THỐNG",
        q: "Một người đàn ông nhìn ảnh và nói: 'Tôi không có anh chị em, nhưng cha của người trong ảnh là con trai của cha tôi'. Người trong ảnh là ai?",
        img: "https://images.unsplash.com/photo-1544717305-2782549b5136?w=700&auto=format&fit=crop&q=80",
        opt: ["Chính người đàn ông đó", "Con trai người đàn ông", "Cha người đàn ông", "Cháu người đàn ông"],
        cor: 1,
        trap: "'Con trai của cha tôi' chính là bản thân anh ta (vì không có anh chị em). Vậy 'Cha của người trong ảnh là tôi' => người trong ảnh là con trai anh ta."
      },
      {
        id: 11,

        opt: ["Không thể làm được", "Hôm qua, Hôm nay, Ngày mai", "Ngày đầu, Ngày giữa, Ngày cuối", "Sáng, Trưa, Tối"],
        cor: 1,
        trap: "Ba ngày liên tiếp nhau chính là: Hôm qua, Hôm nay, Ngày mai."
      },
      {
        id: 99,
        cat: "ĐỐ CHỮ SỰ SỐNG",
        q: "Cái gì lúc ăn thì sống, lúc cho vào lửa nướng nấu thì lại chết?",
        img: "https://images.unsplash.com/photo-1548839140-29a749e1bc4e?w=700&auto=format&fit=crop&q=80",
        opt: ["Con tôm", "Cục nước đá", "Rau sống", "Con ốc"],
        cor: 1,
        trap: "Cục nước đá: ăn sống (ngậm mát), cho vào lửa là tan chảy biến mất (chết)."
      },
      {
        id: 100,
        cat: "CÂU ĐỐ TỔNG KẾT",
        q: "Sau khi hoàn thành 99 câu đố mẹo hóc búa, bạn thấy bài học lớn nhất để không bị lừa là gì?",
        img: "https://images.unsplash.com/photo-1507413245164-6160d8298b31?w=700&auto=format&fit=crop&q=80",
        opt: ["Đừng tin vào phản xạ đầu tiên", "Luôn nghi ngờ câu hỏi chữ nghĩa", "Tư duy đa chiều ngoài chiếc hộp", "Cả 3 đáp án trên"],
        cor: 3,
        trap: "Chúc mừng bạn đã chinh phục trọn vẹn 100 câu đố bẫy não đỉnh cao!"
      }
    ];

    /* ==========================================================
       LOGIC ĐIỀU KHIỂN & LƯU TRỮ TRẠNG THÁI (LOCALSTORAGE)
       ========================================================== */
    let currentIndex = 0;
    let score = 0;
    const userAnswers = JSON.parse(localStorage.getItem('hacknao_quiz_answers') || '{}');

    // DOM Elements
    const quizQuestionEl = document.getElementById('quiz-question');
    const quizImgEl = document.getElementById('quiz-img');
    const quizOptionsEl = document.getElementById('quiz-options');
    const quizExplanationEl = document.getElementById('quiz-explanation');
    const quizTrapTextEl = document.getElementById('quiz-trap-text');
    const labelProgressEl = document.getElementById('label-progress');
    const labelScoreEl = document.getElementById('label-score');
    const progressFillEl = document.getElementById('progress-fill');
    const categoryBadgeEl = document.getElementById('category-badge');
    const btnPrevEl = document.getElementById('btn-prev');
    const btnNextEl = document.getElementById('btn-next');
    const btnThemeEl = document.getElementById('btn-theme');
    const btnGridEl = document.getElementById('btn-grid');
    const modalGridEl = document.getElementById('modal-grid');
    const btnCloseModalEl = document.getElementById('btn-close-modal');
    const gridContainerEl = document.getElementById('grid-container');

    function calculateScore() {
      score = 0;
      Object.keys(userAnswers).forEach(idx => {
        const q = riddles[idx];
        if (q && userAnswers[idx] === q.cor) {
          score += 10;
        }
      });
      labelScoreEl.textContent = `Điểm: ${score}`;
    }

    function renderQuestion(index) {
      const item = riddles[index];
      if (!item) return;

      labelProgressEl.textContent = `Câu ${index + 1}/${riddles.length}`;
      progressFillEl.style.width = `${((index + 1) / riddles.length) * 100}%`;
      categoryBadgeEl.textContent = item.cat || "BẪY LOGIC";

      quizQuestionEl.textContent = `Câu ${index + 1}: ${item.q}`;
      quizImgEl.src = item.img;

      quizOptionsEl.innerHTML = '';
      const hasAnswered = userAnswers.hasOwnProperty(index);

      item.opt.forEach((optionText, optIdx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = `<span><b>${String.fromCharCode(65 + optIdx)}.</b> ${optionText}</span>`;

        if (hasAnswered) {
          btn.disabled = true;
          const chosen = userAnswers[index];
          if (optIdx === item.cor) {
            btn.classList.add('correct');
            btn.innerHTML += ` <span>✓</span>`;
          } else if (optIdx === chosen) {
            btn.classList.add('wrong');
            btn.innerHTML += ` <span>✗</span>`;
          }
        } else {
          btn.addEventListener('click', () => handleSelectOption(optIdx));
        }

        quizOptionsEl.appendChild(btn);
      });

      if (hasAnswered) {
        quizTrapTextEl.textContent = item.trap;
        quizExplanationEl.style.display = 'block';
      } else {
        quizExplanationEl.style.display = 'none';
      }

      btnPrevEl.disabled = index === 0;
      btnNextEl.textContent = index === riddles.length - 1 ? 'Xem kết quả' : 'Tiếp theo →';

      calculateScore();
      renderGridMenu();
    }

    function handleSelectOption(optIdx) {
      if (userAnswers.hasOwnProperty(currentIndex)) return;

      userAnswers[currentIndex] = optIdx;
      localStorage.setItem('hacknao_quiz_answers', JSON.stringify(userAnswers));
      renderQuestion(currentIndex);
    }

    btnPrevEl.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion(currentIndex);
      }
    });

    btnNextEl.addEventListener('click', () => {
      if (currentIndex < riddles.length - 1) {
        currentIndex++;
        renderQuestion(currentIndex);
      } else {
        alert(`Bạn đã hoàn thành 100 câu đố bẫy tư duy! Tổng điểm đạt được: ${score}/1000 điểm.`);
      }
    });

    function initTheme() {
      const saved = localStorage.getItem('hacknao_theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
        btnThemeEl.textContent = '☀️';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        btnThemeEl.textContent = '🌙';
      }
    }

    btnThemeEl.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const newTheme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('hacknao_theme', newTheme);
      btnThemeEl.textContent = newTheme === 'dark' ? '☀️' : '🌙';
    });

    function renderGridMenu() {
      gridContainerEl.innerHTML = '';
      riddles.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.textContent = idx + 1;

        if (idx === currentIndex) btn.classList.add('current');
        if (userAnswers.hasOwnProperty(idx)) {
          if (userAnswers[idx] === q.cor) {
            btn.classList.add('is-correct');
          } else {
            btn.classList.add('is-wrong');
          }
        }

        btn.addEventListener('click', () => {
          currentIndex = idx;
          renderQuestion(currentIndex);
          modalGridEl.classList.remove('active');
        });

        gridContainerEl.appendChild(btn);
      });
    }

    btnGridEl.addEventListener('click', () => {
      renderGridMenu();
      modalGridEl.classList.add('active');
    });

    btnCloseModalEl.addEventListener('click', () => {
      modalGridEl.classList.remove('active');
    });

    modalGridEl.addEventListener('click', (e) => {
      if (e.target === modalGridEl) modalGridEl.classList.remove('active');
    });

    initTheme();
    renderQuestion(currentIndex);
  </script>
</body>
</html>
